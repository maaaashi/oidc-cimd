services:
  demo:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
    # op / client / api-a / api-b run as processes in this one container (see start.js),
    # so "localhost:<port>" resolves identically from the browser and from every process.
    command: node start.js
    environment:
      ISSUER: http://localhost:3000
      CLIENT_BASE: http://localhost:4000
      API_A: http://localhost:5000
      API_B: http://localhost:5001
      # The spec requires https client_id URLs; allow http://localhost for this local demo only.
      ALLOW_HTTP_LOCALHOST_CLIENT_ID: "true"
      # RFC 8707: resource identifiers the OP will issue access tokens for.
      RESOURCES: http://localhost:5000,http://localhost:5001
    ports:
      - "3000:3000" # op
      - "4000:4000" # client (RP)
      - "5000:5000" # api-a
      - "5001:5001" # api-b
